# SonarCloud automatic analysis: what is left out of it, and why.
#
# Dockerfiles. Every one here builds a local test or package-build image;
# none is published as an image that runs the library. The findings were
# reviewed (November 2026):
#   - S6470, `COPY .` of the build context: what can enter an image is
#     bounded by the allowlist in .dockerignore, which the rule doesn't read.
#   - S6471, root as the default user: the swtpm and Kubernetes test images
#     run only tests, and packaging/overlay is a `scratch` file tree that is
#     copied from, never run.
#
# fuzz/. The harness feeds the CLI hostile paths and file modes on purpose
# ("/tmp/k.bin", a world-readable DEK file, paths from its own command
# line); those are its inputs, in directories it creates 0700.
sonar.exclusions=**/Dockerfile,**/Dockerfile.*,fuzz/**

# Release: for a v* tag, runs the whole build workflow, assembles its
# artifacts into release assets (packaging/release-assets.sh), attests
# their build provenance with Sigstore, and opens a draft GitHub release
# holding them. Publishing the draft is a maintainer's decision. The
# `overlay` job pushes the FROM-scratch overlay images
# (packaging/overlay/Dockerfile) to ghcr.io, attests them and signs them
# with cosign; unlike the release, those are live as soon as the job runs. Each overlay also carries
# a Sigstore bundle attesting its library file, beside the library.
#
# Attestations are signed through the public-good Sigstore instance (this
# repository is public) and recorded in its transparency log. Verify a
# download with:
#   gh attestation verify <file> --repo runsecure/hkdfguard-native-linux
#
# The publish job runs in the `release` environment: give it required
# reviewers and restrict it to v* tags in the repository settings.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write     # create the draft release
      id-token: write     # OIDC token for the Sigstore signing certificate
      attestations: write # store the attestation with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml, debian/changelog and the RPM spec
        run: packaging/check-version.sh "$GITHUB_REF_NAME"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release/artifacts

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install

      - name: Assemble release assets
        run: |
          cargo fetch --locked
          packaging/release-assets.sh release/artifacts release/assets

      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/attestation-subjects.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # The Sigstore bundle, for verifying without the GitHub API:
          #   gh attestation verify <file> --bundle hkdfguard-<version>.sigstore.json --repo <owner>/<repo>
          cp "$BUNDLE" "release/assets/hkdfguard-$version.sigstore.json"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release/assets/* \
            --draft --verify-tag "${prerelease[@]}" \
            --title "HKDFGuard $version" --generate-notes

  overlay:
    name: publish the scratch overlay images
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      packages: write          # push to ghcr.io
      id-token: write          # OIDC token for the Sigstore signing certificate
      attestations: write      # store the attestations with the repository
      artifact-metadata: write # storage records for the pushed images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Ubuntu 24.04 packages the build workflow built and tested,
      # into dist/packages/ubuntu24.04-<arch>/ as the Dockerfile expects.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-ubuntu24.04-*
          path: release/artifacts
      - name: Arrange the packages for the overlay build
        run: |
          mkdir -p dist/packages
          for dir in release/artifacts/packages-ubuntu24.04-*; do
            mv "$dir" "dist/packages/${dir#release/artifacts/packages-}"
          done
          ls -R dist/packages

      # The library each overlay architecture will hold -- the same file the
      # Dockerfile copies out of the same package -- attested on its own, so
      # the bundle shipped beside it in the image verifies the deployed copy.
      - name: Extract the overlay's libraries
        run: |
          : > release/library-subjects.txt
          for dir in dist/packages/ubuntu24.04-*; do
            arch=${dir##*-}
            debs=("$dir"/libhkdfguard1_*_"$arch".deb)
            [ "${#debs[@]}" -eq 1 ] && [ -f "${debs[0]}" ] || { echo "expected one libhkdfguard1 package in $dir" >&2; exit 1; }
            dpkg-deb --extract "${debs[0]}" "release/unpacked-$arch"
            (cd "release/unpacked-$arch" && sha256sum usr/lib/*-linux-gnu/libhkdfguard.so.1) >> release/library-subjects.txt
          done
          cat release/library-subjects.txt

      - name: Attest the overlay's libraries
        id: attest-library
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/library-subjects.txt

      # Fails the release unless the bundle verifies each extracted library
      # against this workflow's identity, as a consumer would check it.
      - name: Verify the bundle against the libraries
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest-library.outputs.bundle-path }}
        run: |
          mkdir -p release/sigstore
          cp "$BUNDLE" release/sigstore/libhkdfguard.so.1.sigstore.json
          for lib in release/unpacked-*/usr/lib/*-linux-gnu/libhkdfguard.so.1; do
            gh attestation verify "$lib" \
              --bundle release/sigstore/libhkdfguard.so.1.sigstore.json \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Both architectures from one runner: the Dockerfile unpacks the
      # packages on the build platform, so arm64 needs no emulation.
      - name: Build and push both targets
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hkdfguard-overlay"
          version=${GITHUB_REF_NAME#v}
          docker buildx create --use --driver docker-container --name overlay
          for target in overlay overlay-dev; do
            tag="$image:$version${target#overlay}"
            docker buildx build --platform linux/amd64,linux/arm64 --push \
              -f packaging/overlay/Dockerfile --build-context packages=dist/packages \
              --build-context sigstore=release/sigstore --build-arg REQUIRE_SIGSTORE_BUNDLE=1 \
              --target "$target" -t "$tag" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$version" \
              --label "org.opencontainers.image.licenses=MPL-2.0" \
              --metadata-file "release/$target.json" packaging/overlay
            echo "${target}-digest=$(jq -r '."containerimage.digest"' "release/$target.json")" >> "$GITHUB_OUTPUT"
            echo "pushed $tag"
          done
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Attest the overlay image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.overlay-digest }}
          push-to-registry: true

      - name: Attest the overlay-dev image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.overlay-dev-digest }}
          push-to-registry: true

      # A cosign signature too, alongside the provenance attestations: the
      # form most image-verification tooling (`cosign verify`, Kyverno, the
      # sigstore policy-controller) checks with no attestation-specific setup.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless, with this job's OIDC identity, by digest so a moved tag can't
      # be what gets signed. Then verified as a consumer would check it, so
      # an unverifiable signature fails the release.
      - name: Sign both images with cosign
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          OVERLAY_DIGEST: ${{ steps.push.outputs.overlay-digest }}
          OVERLAY_DEV_DIGEST: ${{ steps.push.outputs.overlay-dev-digest }}
        run: |
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF"
          for digest in "$OVERLAY_DIGEST" "$OVERLAY_DEV_DIGEST"; do
            cosign sign --yes "$IMAGE@$digest"
            cosign verify "$IMAGE@$digest" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "$identity" > /dev/null
            echo "signed and verified $IMAGE@$digest"
          done
